<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Currency Converter</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(rgb(150, 184, 186),rgb(117, 215, 215));
      overflow: hidden;
    }
    .top-buttons {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 20;
    }
    .top-buttons button {
      margin-left: 10px;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background-color: #ffffff40;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .top-buttons button:hover {
      background-color: #ffffff60;
    }
    .floating-sticker {
      position: absolute;
      width: 60px;
      height: 60px;
      background-size: contain;
      background-repeat: no-repeat;
      animation: floatSticker 20s linear infinite;
      opacity: 0.2;
      z-index: 1;
    }
    @keyframes floatSticker {
      0% {
        transform: translateY(100vh);
      }
      100% {
        transform: translateY(-100vh);
      }
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 30px;
      max-width: 400px;
      margin: 12vh auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      z-index: 10;
      position: relative;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    h2 {
      color:#fff;
      font-size: 2em;
      margin-bottom: 20px;
    }
    select, input, button {
      padding: 12px 15px;
      margin: 15px 0;
      width: 90%;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 1em;
      transition: 0.3s ease-in-out;
    }
    input:focus, select:focus {
      border-color: #667eea;
      outline: none;
      box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
    }
    button {
      background-color: #667eea;
      color:white;
      border: none;
      font-weight: bold;
      transition: background-color 0.3s;
      cursor: pointer;
    }
    button:hover {
      background-color: #5a67d8;
    }
    #result {
      margin-top: 20px;
      font-size: 1.4em;
      font-weight: bold;
      color: #fff;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 12px;
    }
    #aboutPage {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 600px;
      width: 90%;
      padding: 30px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border-radius: 40px;
      backdrop-filter: blur(75px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 999;
      text-align: center;
    }
    #aboutPage h3 {
      font-size: 2em;
      margin-bottom: 10px;
    }
    #aboutPage p {
      font-size: 1.1em;
    }
    #closeAbout {
      margin-top: 20px;
      padding: 10px 20px;
      background: #ff6b6b;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="top-buttons">
    <button onclick="showAbout()">About Us</button>
    <button onclick="location.href='https://www.exchangeratesapi.io/live';">Live Rates</button>
  </div>

  <div class="container">
    <h2>Currency Converter 💱</h2>
    <input type="number" id="amount" placeholder="Enter amount" />
    <br>
    <select id="fromCurrency"></select>
    <br>
    <select id="toCurrency"></select>
    <br>
    <button onclick="convertCurrency()">Convert</button>
    <div id="result"></div>
  </div>

  <div id="aboutPage">
    <h3 style="font-style: italic;">About Us</h3>
    <p>This currency converter project program has been made to demonstrate the use of API key for real-time exchange rates using the exchangeratesapi.io API.<br>
        <br>Made by Sahil and it's team 💻🌐
    <br><b>Teammates name:-</b>
    <br> >> Sagar Ghosh<br>
    <br> >> Niraj Rajak<br>
    <br> >> Ritesh kumar mandal<br></p>
    <button id="closeAbout" onclick="hideAbout()">Close</button>
  </div>

  <script>
    const stickerImages = [
      'https://cdn-icons-png.flaticon.com/512/197/197484.png', // USD
      'https://cdn-icons-png.flaticon.com/512/197/197374.png', // EUR
      'https://cdn-icons-png.flaticon.com/512/197/197593.png', // INR
      'https://cdn-icons-png.flaticon.com/512/197/197430.png', // GBP
      'https://cdn-icons-png.flaticon.com/512/197/197386.png', // JPY
      'https://cdn-icons-png.flaticon.com/512/197/197407.png', // CNY
      'https://cdn-icons-png.flaticon.com/512/197/197408.png'  // KRW
    ];

    for (let i = 0; i < 30; i++) {
      const sticker = document.createElement('div');
      sticker.classList.add('floating-sticker');
      sticker.style.left = Math.random() * 100 + 'vw';
      sticker.style.top = Math.random() * 100 + 'vh';
      sticker.style.backgroundImage = url(${stickerImages[Math.floor(Math.random() * stickerImages.length)]});
      sticker.style.animationDuration = (10 + Math.random() * 15) + 's';
      document.body.appendChild(sticker);
    }

    function showAbout() {
      document.getElementById("aboutPage").style.display = "block";
    }
    function hideAbout() {
      document.getElementById("aboutPage").style.display = "none";
    }
  </script>

  <script>
    const apiKey = "d7e5cda6f9682262fbb4cc7bb369b21b";
    const apiUrl = https://api.exchangeratesapi.io/v1/latest?access_key=${apiKey};

    async function populateCurrencies() {
      try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        const currencies = Object.keys(data.rates);
        const fromSelect = document.getElementById("fromCurrency");
        const toSelect = document.getElementById("toCurrency");

        currencies.forEach(currency => {
          const option1 = document.createElement("option");
          const option2 = document.createElement("option");
          option1.value = option2.value = currency;
          option1.textContent = option2.textContent = currency;
          fromSelect.appendChild(option1);
          toSelect.appendChild(option2);
        });

        fromSelect.value = "USD";
        toSelect.value = "INR";

      } catch (error) {
        document.getElementById("result").textContent = "Error loading currencies.";
        console.error(error);
      }
    }

    async function convertCurrency() {
      const amount = parseFloat(document.getElementById("amount").value);
      const from = document.getElementById("fromCurrency").value;
      const to = document.getElementById("toCurrency").value;

      if (!amount || amount <= 0) {
        document.getElementById("result").textContent = "Enter a valid amount.";
        return;
      }

      try {
        const response = await fetch(${apiUrl}&symbols=${from},${to});
        const data = await response.json();

        if (data.success && data.rates[from] && data.rates[to]) {
          const eurToFrom = data.rates[from];
          const eurToTo = data.rates[to];
          const converted = ((amount / eurToFrom) * eurToTo).toFixed(2);
          document.getElementById("result").textContent = ${amount} ${from} = ${converted} ${to};
        } else {
          document.getElementById("result").textContent = "Conversion failed. Check API response.";
          console.error(data);
        }
      } catch (error) {
        document.getElementById("result").textContent = "API error.";
        console.error(error);
      }
    }

    populateCurrencies();
  </script>
  <script>
    window.watsonAssistantChatOptions = {
      integrationID: "4206685b-632d-44de-a13b-428973a435b1", // The ID of this integration.
      region: "jp-tok", // The region your integration is hosted in.
      serviceInstanceID: "4b52c771-f9b1-4900-9207-b7273c8c9961", // The ID of your service instance.
      onLoad: async (instance) => { await instance.render(); }
    };
    setTimeout(function(){
      const t=document.createElement('script');
      t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + (window.watsonAssistantChatOptions.clientVersion || 'latest') + "/WatsonAssistantChatEntry.js";
      document.head.appendChild(t);
    });
  </script>
</body>
</html>
